# fly.toml app configuration file generated for pknu-climate-competition-server on 2026-11-17T06:12:19Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'pknu-climate-competition-server'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  processes = ['app']
  size = 'shared-cpu-1x'
